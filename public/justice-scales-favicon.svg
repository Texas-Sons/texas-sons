<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBA73" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#9A7B38" />
    </linearGradient>
    <radialGradient id="navyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1f44" />
      <stop offset="100%" stop-color="#00081e" />
    </radialGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="128" height="128" rx="28" fill="url(#navyGlow)" />
  
  <!-- Outer Border -->
  <rect x="8" y="8" width="112" height="112" rx="22" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.6" />

  <!-- Scales of Justice Center Column -->
  <path d="M64 24 L64 96 M48 96 L80 96 M56 24 L72 24" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Center Pivot Finial -->
  <circle cx="64" cy="24" r="5" fill="url(#goldGrad)" />
  
  <!-- Balance Beam -->
  <path d="M28 42 L100 42" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Left Scale Pan -->
  <path d="M28 42 L18 68 M28 42 L38 68 M14 68 Q28 82 42 68 Z" fill="url(#goldGrad)" stroke="url(#goldGrad)" stroke-width="2" stroke-linejoin="round" />

  <!-- Right Scale Pan -->
  <path d="M100 42 L90 68 M100 42 L110 68 M86 68 Q100 82 114 68 Z" fill="url(#goldGrad)" stroke="url(#goldGrad)" stroke-width="2" stroke-linejoin="round" />
</svg>
